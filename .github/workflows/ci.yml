name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint (syntax errors and pyflakes; see ruff.toml)
        run: |
          pip install ruff==0.17.0
          ruff check .

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch (the default Linux wheel pulls in CUDA)
        run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned requirements
        run: pip install -r requirements.txt

      - name: Leakage checks (purged blocked CV, leave-one-attack-type-out)
        run: python -W ignore tests/test_leakage.py

      - name: Threshold-method checks (coverage by simulation)
        run: python -W ignore tests/test_threshold_methods.py

      - name: PCAP to state vector
        run: python -W ignore tests/test_phase1.py

      - name: Demo pipeline on the bundled samples
        run: python -W ignore tests/test_phase5.py

      - name: Streamlit demo smoke test
        run: python -W ignore tests/test_demo_app.py

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo image
        run: docker build -t attack-demo .

      - name: Run the tests inside the image
        run: |
          docker run --rm attack-demo python -W ignore tests/test_leakage.py
          docker run --rm attack-demo python -W ignore tests/test_phase5.py

      - name: The container serves the demo
        run: |
          docker run -d --name demo -p 8501:8501 attack-demo
          for i in $(seq 1 60); do
            curl -fs http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fs http://localhost:8501/_stcore/health
          curl -fs http://localhost:8501/ | grep -qi streamlit
          docker logs demo | tail -20
